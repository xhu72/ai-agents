name: spam-filter-email-agent

on:
  push:
    paths:
      - "spam-filter-email-agent/**"
      - ".github/workflows/spam-filter-email-agent.yml"
  pull_request:
    paths:
      - "spam-filter-email-agent/**"
      - ".github/workflows/spam-filter-email-agent.yml"
  workflow_dispatch:          

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spam-filter-email-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -v
